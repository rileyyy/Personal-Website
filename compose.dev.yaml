# Local development compose file — builds from source with hot-reload.
#
#   docker compose -f compose.dev.yaml up
#   docker compose -f compose.dev.yaml --profile backend --profile database up
#
services:
  node-app:
    build:
      context: .
      dockerfile: Dockerfile.node.dev
      args:
        ENVIRONMENT: ${ENVIRONMENT}
    develop:
      watch:
        - action: sync
          path: ./website
          target: /app/website
          ignore:
            - website/node_modules
        - action: rebuild
          path: Dockerfile.node.dev
        - action: rebuild
          path: compose.dev.yaml
        - action: sync+restart
          path: ./website/package.json
          target: /app/website/package.json
    ports:
      - "5173:5173"
    restart: always
    environment:
      - NODE_ENV=${ENVIRONMENT}
    volumes:
      - ./:/app
      - /app/website/node_modules

  asp-net:
    build:
      context: .
      dockerfile: Dockerfile.aspnet.dev
    develop:
      watch:
        - action: sync
          path: ./data/
          target: /data
        - action: rebuild
          path: ./database-interface/
    ports:
      - "25052:25052"
    depends_on:
      - mongodb
    networks:
      - asp-mongodb
    secrets:
      - mongodb_username
      - mongodb_password
    volumes:
      - ./data:/data
    profiles: ['backend']

  mongodb:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongodb_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_password
      MONGO_INITDB_DATABASE: chat_app
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
    networks:
      - asp-mongodb
    ports:
      - '27017:27017'
    restart: always
    secrets:
      - mongodb_username
      - mongodb_password
    volumes:
      - ./docker/mongodb_data:/data/db
    profiles: ['database']

networks:
  asp-mongodb:
    driver: bridge

secrets:
  mongodb_username:
    file: ./secrets/mongodb_username.secret
  mongodb_password:
    file: ./secrets/mongodb_password.secret
